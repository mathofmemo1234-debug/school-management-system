<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="./default_logo.png" />
    <link rel="apple-touch-icon" href="./default_logo.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مدارس المتقدمة" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="بوابة الدخول الموحدة لنظام إدارة المدارس المتقدمة للتعلم الذكي بجدة - لوحة تحكم الطلاب والمعلمين والإدارة.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>بوابة شركة المدارس المتقدمة للتعلم الذكي والإدارة المدرسية</title>
    <script>
      // Global catcher for legacy cached chunks / dynamic import fetch failures
      (function() {
        function handleChunkError(errStr) {
          if (
            typeof errStr === 'string' &&
            (errStr.indexOf('Failed to fetch dynamically imported module') !== -1 ||
             errStr.indexOf('error loading dynamically imported module') !== -1 ||
             errStr.indexOf('Loading chunk') !== -1 ||
             errStr.indexOf('ChunkLoadError') !== -1)
          ) {
            var last = sessionStorage.getItem('chunk_err_auto_reload');
            var now = Date.now();
            if (!last || (now - parseInt(last, 10)) > 10000) {
              sessionStorage.setItem('chunk_err_auto_reload', now.toString());
              window.location.reload();
            }
          }
        }

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          handleChunkError(msg);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason.toString())) || '';
          handleChunkError(msg);
        });
      })();

      // Protect React from DOM modifications made by Google Translate
      if (typeof Node === 'function' && Node.prototype) {
        var origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            return child;
          }
          return origRemoveChild.apply(this, arguments);
        };
        var origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return newNode;
          }
          return origInsertBefore.apply(this, arguments);
        };
      }
    </script>
  </head>
  <body>
    <!-- Hidden Google Translate Element Container -->
    <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; left:-9999px; top:-9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'ar',
            includedLanguages: 'ar,en,zh-CN',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function(err) {
            console.warn('ServiceWorker registration notice:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
